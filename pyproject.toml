[project]
name = "dunossauro-fastapi-zero"
version = "0.1.0"
description = ""
authors = [{ name = "Paulo Henrique Reis", email = "phdsreis@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "fastapi[standard] (>=0.142.2,<0.143.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "mako (>=1.4.3,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "tzdata (>=2026.5,<2027.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "typos (>=1.50.3,<2.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
aysncio_default_fixture_loop_scope = 'function'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev fastapi_zero/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fastapi_zero -vv'
post_test = 'coverage html'

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
